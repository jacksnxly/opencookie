packages:
  - packages/*
  - packages/adapters/*
  - apps/*
  - fixtures/*

allowBuilds:
  esbuild: true
  unrs-resolver@1.12.2: false

linkWorkspacePackages: false
overrides:
  "cookie@0.6.0": 0.7.2
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
  "minimatch@>=7.0.0 <11.0.1": 11.0.8
  "qs@>=6.0.0 <6.16.2": 6.16.2
  "@nuxt/schema@4.5.2": 4.6.4
  "srvx@0.10.1": 0.11.22
minimumReleaseAgeExclude:
  - "@vue/language-core@3.3.11"
  - vue-tsc@3.3.11
preferWorkspacePackages: false
saveWorkspaceProtocol: rolling
