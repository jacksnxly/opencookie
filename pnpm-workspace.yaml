packages:
  - packages/*
  - packages/adapters/*
  - apps/*
  - fixtures/*

allowBuilds:
  esbuild: true
  unrs-resolver@1.12.2: false

linkWorkspacePackages: false
audit:
  ignore:
    # deepmerge: withdrawn upstream, no patched release.
    - GHSA-gcqx-w48m-w2h4
    # minimatch: the only fix is minimatch 11, which Verdaccio (local test registry) cannot run on.
    - GHSA-g3hv-75wg-m249
    # @nuxt/schema: shipped by @opencookie-dev/nuxt; fixed in that package's next release.
    - GHSA-mjrq-cffv-q4qc
overrides:
  "cookie@0.6.0": 0.7.2
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
  "qs@>=6.0.0 <6.16.2": 6.16.2
  "srvx@0.10.1": 0.11.22
packageExtensions:
  "@nuxt/kit@4.5.2":
    dependencies:
      "@nuxt/schema": 4.5.2
minimumReleaseAgeExclude:
  - "@vue/language-core@3.3.11"
  - vue-tsc@3.3.11
preferWorkspacePackages: false
saveWorkspaceProtocol: rolling
