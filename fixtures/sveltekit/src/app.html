<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta data-oc-csp nonce="%sveltekit.nonce%" />
		<title>OpenCookie SvelteKit fixture</title>
		<script defer nonce="%sveltekit.nonce%" src="/essential.js"></script>
		<script
			type="text/plain"
			nonce="%sveltekit.nonce%"
			data-oc-resource="analytics-script"
			data-oc-category="analytics"
			data-src="http://tracker.sveltekit.opencookie.test:4400/analytics.js?resource=initial"
		></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="svelte-body">%sveltekit.body%</div>
	</body>
</html>
