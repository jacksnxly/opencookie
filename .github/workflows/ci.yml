name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["**@*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # --init: GitHub starts job containers with `tail -f /dev/null` as PID 1,
      # which never reaps orphans. Killed test children would linger as zombies
      # and still answer kill(pid, 0), so the DX teardown tests fail.
      options: --user 1001 --init
    env:
      CI: "1"
      FORCE_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the incremental mutation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Verify the change tier
        run: pnpm verify

      - name: Retain traces, videos, screenshots, and reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-verify
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  dependency-review:
    # Fails a pull request that adds a dependency version with a known
    # vulnerability. It skips only the advisories that pnpm-workspace.yaml
    # accepts under audit.ignore, each with its reason there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review the dependencies this pull request changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-ghsas: GHSA-g3hv-75wg-m249

  release-browser:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --init
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: "1"
      FORCE_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages, docs, and production fixtures
        run: pnpm build

      - name: Run the release browser matrix
        run: pnpm e2e --tier=release --skip-build "--project=*-${{ matrix.browser }}-*"

  release-gates:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --init
    env:
      CI: "1"
      FORCE_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the incremental mutation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Run the release gates that this host can prove
        run: node scripts/verify-tier.mjs release --skip browser --skip cdn-performance --skip candidate
